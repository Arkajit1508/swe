  <!-- Central IEM Bold Typography -->
  <!-- "I" -->
  <path d="M 108,72 L 138,72 L 138,155 L 108,155 Z" fill="#0c121e"/>
  
  <!-- "E" -->
  <path d="M 152,72 L 216,72 L 216,94 L 180,94 L 180,103 L 210,103 L 210,123 L 180,123 L 180,133 L 218,133 L 218,155 L 152,155 Z" fill="#0c121e"/>
  
  <!-- "M" -->
  <path d="M 230,72 L 254,72 L 268,118 L 282,72 L 306,72 L 306,155 L 282,155 L 282,105 L 272,138 L 264,138 L 254,105 L 254,155 L 230,155 Z" fill="#0c121e"/>

  <!-- Sanskrit Motto: श्रद्धावान् लभते ज्ञानम् -->
  <text x="200" y="180" font-family="'Noto Sans Devanagari', 'Mangal', 'Segoe UI', serif" font-size="15.5" font-weight="600" text-anchor="middle" fill="#0c121e" letter-spacing="1.2">
    श्रद्धावान् लभते ज्ञानम्
